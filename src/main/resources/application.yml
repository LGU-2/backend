spring:
  application:
    name: freshmarket

  # 로컬에서만 쓰는 시크릿(카카오 키, JWT_SECRET 등)은 프로젝트 루트의 application-local.yml에
  # 적는다. optional: 이라 파일이 없으면(팀원 전원의 기본 상태) 조용히 넘어간다 — 켜고 끄는
  # 프로필 절차가 따로 없다. [주의] file: 접두사는 클래스패스가 아니라 실행 시점 작업 디렉터리
  # 기준 경로다 — 그래서 이 파일은 반드시 프로젝트 루트에 있어야 한다(resources 안이 아니다).
  config:

  profiles:
    # 아무도 프로필을 지정하지 않으면 local 로 본다. 배포와 테스트는 프로필을 직접 주므로 이 값이 덮인다
    default: local

  # 아래 셋은 환경마다 갈린다. 값을 주지 않으면 compose.yaml 의 기본 구성에 맞는다.
  # 운영은 application-prod.yml 이 기본값 없이 다시 선언하므로 이 기본값이 살아나지 않는다.
  # bootRun 은 spring-boot-docker-compose 가 띄운 컨테이너에서 읽어낸 값이 이 셋을 덮는다
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/freshmarket?serverTimezone=UTC&characterEncoding=UTF-8}"
    username: "${DB_USERNAME:freshmarket}"
    password: "${DB_PASSWORD:freshmarket}"
    driver-class-name: com.mysql.cj.jdbc.Driver

    # 값의 근거는 infra 의 앱과DB 장애대응구조 4.4~4.6절에 있다.
    # 안쪽이 더 짧아야 톰캣 스레드가 DB 를 기다리다 고갈되지 않는다
    hikari:
      # 풀이 마르면 요청은 여기서 3초 만에 실패한다. 스레드를 붙잡고 있지 않는다
      connection-timeout: 3000
      validation-timeout: 1000
      keepalive-time: 120000
      # MySQL wait_timeout 보다 짧아야 죽은 커넥션을 잡는다
      max-lifetime: 1500000
      # 풀 크기를 고정한다. 커넥션 예산이 max_connections 약 60 에 묶여 있다
      maximum-pool-size: 10
      minimum-idle: 10
      # URL 에 붙이지 않고 여기서 준다. 어떤 URL 이 와도 값이 유지된다
      data-source-properties:
        connectTimeout: 3000
        socketTimeout: 10000

  jpa:
    # 스키마는 Flyway 가 소유한다. Hibernate 는 어긋나면 기동을 막는 역할만 한다
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  # 로그인 state/nonce(KakaoLoginStateRepository), access token valid-after 커트라인,
  # refresh token rotation(CAS Lua 스크립트)이 전부 Redis에 있다.
  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: "${REDIS_PORT:6379}"

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: "${KAKAO_CLIENT_ID}"
            client-secret: "${KAKAO_CLIENT_SECRET}"
            authorization-grant-type: authorization_code
            # (2026-08-18 12:00) docs/api/auth.md 기준 프론트-콜백형으로 바뀌면서 백엔드가 아니라
            # 프론트 주소를 가리킨다 — 카카오가 이 주소로 302 리다이렉트하면 프론트가 그 code를 받아
            # POST /v1/auth/tokens로 넘긴다.
            redirect-uri: "${KAKAO_REDIRECT_URI:http://localhost:5173/oauth/callback}"
            scope: openid
        provider:
          kakao:
            issuer-uri: https://kauth.kakao.com
            user-info-uri: https://kapi.kakao.com/v1/oidc/userinfo
            user-name-attribute: sub

  lifecycle:
    # 종료 타임아웃 계층의 안쪽에서 셋째다. compose 45초, systemd 60초가 바깥이다
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  # 처리 중인 요청을 마치고 내려간다. 대상 그룹 해제 지연 30초와 짝을 이룬다
  shutdown: graceful
  tomcat:
    threads:
      max: 200

# 액추에이터를 8081 로 분리한다.
# 8080 에 /actuator 경로가 존재하지 않게 되어 밖에서 막을 규칙이 필요 없다.
# 근거는 infra 의 기술스택 확정문서 4.2절에 있다.
management:
  server:
    port: 8081

  endpoints:
    web:
      exposure:
        include: health, info, prometheus

  endpoint:
    health:
      # liveness 와 readiness 를 나눈다. 기동 중인 앱은 살아 있지만 준비되지 않았다
      probes:
        enabled: true
      # 밖에서 볼 수 있으므로 상세를 숨긴다
      show-details: never
      group:
        # 공유 의존성을 넣지 않는다 (INF-16).
        # DB 가 흔들리면 전 인스턴스가 동시에 대상 그룹에서 빠져 서비스가 통째로 끊긴다
        readiness:
          include: diskSpace

  metrics:
    tags:
      application: "${APP_NAME:freshmarket}"
      instance: "${APP_INSTANCE_ID:local}"

  tracing:
    sampling:
      # 장애 주입 실험 직전에 100% 로 올릴 수 있어야 한다
      probability: "${TRACE_SAMPLE_RATE:0.1}"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  # (2026-08-18 12:00) 프론트 콜백형으로 바뀌면서 로그인 성공/실패 시 백엔드가 프론트로 리다이렉트하는
  # 지점이 없어졌다(응답은 항상 JSON) — 그래서 예전의 app.frontend.callback-url은 여기서는 안 쓰고,
  # CORS 허용 오리진으로만 프론트 주소가 필요하다.
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173}"

jwt:
  secret: "${JWT_SECRET}"
  access-token-validity-ms: "${JWT_ACCESS_VALIDITY_MS:1800000}"      # 30분 (docs/api/auth.md 기준)
  refresh-token-validity-ms: "${JWT_REFRESH_VALIDITY_MS:1209600000}" # 14일
  cookie:
    # 로컬은 http라 Secure 쿠키를 켜면 브라우저가 쿠키를 안 보낸다 — 운영(https)에서는 반드시 true로.
    secure: "${JWT_COOKIE_SECURE:false}"

# 카카오 연결 해제 웹훅(KakaoUnlinkWebhookController) 검증용 — 우리 app_id인지, admin key가
# 맞는지 확인한다. 로그아웃 시 카카오 로그아웃 API 호출(KakaoLogoutClient)에도 admin-key를 쓴다.
kakao:
  app-id: "${KAKAO_APP_ID}"
  admin-key: "${KAKAO_ADMIN_KEY}"
