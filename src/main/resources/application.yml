spring:
  application:
    name: freshmarket

  profiles:
    # 아무도 프로필을 지정하지 않으면 local 로 본다. 배포와 테스트는 프로필을 직접 주므로 이 값이 덮인다
    default: local

  # 아래 셋은 환경마다 갈린다. 값을 주지 않으면 compose.yaml 의 기본 구성에 맞는다.
  # 운영은 application-prod.yml 이 기본값 없이 다시 선언하므로 이 기본값이 살아나지 않는다.
  # bootRun 은 spring-boot-docker-compose 가 띄운 컨테이너에서 읽어낸 값이 이 셋을 덮는다
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/freshmarket?serverTimezone=UTC&characterEncoding=UTF-8}"
    username: "${DB_USERNAME:freshmarket}"
    password: "${DB_PASSWORD:freshmarket}"
    driver-class-name: com.mysql.cj.jdbc.Driver

    # 값의 근거는 infra 의 앱과DB 장애대응구조 4.4~4.6절에 있다.
    # 안쪽이 더 짧아야 톰캣 스레드가 DB 를 기다리다 고갈되지 않는다
    hikari:
      # 풀이 마르면 요청은 여기서 3초 만에 실패한다. 스레드를 붙잡고 있지 않는다
      connection-timeout: 3000
      validation-timeout: 1000
      keepalive-time: 120000
      # MySQL wait_timeout 보다 짧아야 죽은 커넥션을 잡는다
      max-lifetime: 1500000
      # 풀 크기를 고정한다. 커넥션 예산이 max_connections 약 60 에 묶여 있다
      maximum-pool-size: 10
      minimum-idle: 10
      # URL 에 붙이지 않고 여기서 준다. 어떤 URL 이 와도 값이 유지된다
      data-source-properties:
        connectTimeout: 3000
        socketTimeout: 10000

  jpa:
    # 스키마는 Flyway 가 소유한다. Hibernate 는 어긋나면 기동을 막는 역할만 한다
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  lifecycle:
    # 종료 타임아웃 계층의 안쪽에서 셋째다. compose 45초, systemd 60초가 바깥이다
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  # 처리 중인 요청을 마치고 내려간다. 대상 그룹 해제 지연 30초와 짝을 이룬다
  shutdown: graceful
  tomcat:
    threads:
      max: 200

# 액추에이터를 8081 로 분리한다.
# 8080 에 /actuator 경로가 존재하지 않게 되어 밖에서 막을 규칙이 필요 없다.
# 근거는 infra 의 기술스택 확정문서 4.2절에 있다.
management:
  server:
    port: 8081

  endpoints:
    web:
      exposure:
        include: health, info, prometheus

  endpoint:
    health:
      # liveness 와 readiness 를 나눈다. 기동 중인 앱은 살아 있지만 준비되지 않았다
      probes:
        enabled: true
      # 밖에서 볼 수 있으므로 상세를 숨긴다
      show-details: never
      group:
        # 공유 의존성을 넣지 않는다 (INF-16).
        # DB 가 흔들리면 전 인스턴스가 동시에 대상 그룹에서 빠져 서비스가 통째로 끊긴다
        readiness:
          include: diskSpace

  metrics:
    tags:
      application: "${APP_NAME:freshmarket}"
      instance: "${APP_INSTANCE_ID:local}"

  tracing:
    sampling:
      # 장애 주입 실험 직전에 100% 로 올릴 수 있어야 한다
      probability: "${TRACE_SAMPLE_RATE:0.1}"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    # auth.md: 로그인(POST)/재발급(POST :refresh)/로그아웃(DELETE)이 이 경로 하나를 공유한다
    admin-auth-path: "${ADMIN_AUTH_PATH:/v1/admin/auth/tokens}"
  jwt:
    # 로컬 개발 편의를 위한 기본값이다. 운영에서는 반드시 환경변수/시크릿 매니저로 덮어쓴다.
    # 소스에 실키를 넣지 않는다 (비기능요구사항 보안 > 자격 증명 관리).
    secret: "${JWT_SECRET:local-dev-only-secret-key-please-override-in-real-environments}"
    admin:
      # 관리자 Access 30분 / Refresh 1일, 자동 로그인 미제공 (인증(OIDC) 설계 시트 3항)
      access-token-validity-seconds: ${ADMIN_ACCESS_TOKEN_VALIDITY_SECONDS:1800}
      refresh-token-validity-seconds: ${ADMIN_REFRESH_TOKEN_VALIDITY_SECONDS:86400}
      # 리프레시 토큰 쿠키의 Secure 속성. 운영은 HTTPS 라 true 가 기본이다.
      # 로컬 개발은 보통 HTTP 라 true 로 두면 브라우저가 쿠키를 아예 안 보낸다 - 로컬에서는 환경변수로 false 를 덮어쓴다.
      refresh-cookie-secure: ${ADMIN_REFRESH_COOKIE_SECURE:true}